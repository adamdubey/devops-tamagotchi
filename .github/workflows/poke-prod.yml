name: 😈 Poke Prod

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What should we do to prod?"
        required: true
        default: incident
        type: choice
        options:
          - incident
          - cpu
          - memory
          - heal
          - feed

permissions:
  contents: write

concurrency:
  group: tamagotchi-state
  cancel-in-progress: false

jobs:
  chaos:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📋 State before chaos
        run: cat state.json

      - name: 😈 Poke production
        run: python scripts/poke_prod.py "${{ inputs.action }}"

      - name: 🔍 State after chaos
        run: cat state.json

      - name: 🎨 Regenerate dashboard
        run: python scripts/tamagotchi.py --render-only

      - name: 🔍 State after rendering
        run: cat state.json

      - name: 🔍 Check generated dashboard
        run: |
          echo "===== GENERATED ASSETS ====="
          ls -la assets/

          echo ""
          echo "===== DASHBOARD STATUS ====="
          grep "STATUS" -A 2 assets/dashboard-*.svg || true

          echo ""
          echo "===== README IMAGE ====="
          grep "dashboard-" README.md || true

      - name: 💾 Persist chaos
        run: |
          git config user.name "devops-tamagotchi[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            state.json \
            incidents.json \
            assets/ \
            README.md

          echo "===== CHANGES ====="
          git status --short

          git diff --cached --quiet && exit 0

          git commit -m "😈 poke prod: ${{ inputs.action }}"
          git push origin HEAD:main