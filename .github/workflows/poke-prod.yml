name: 😈 Poke Prod

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What should we do to prod?"
        required: true
        default: incident
        type: choice
        options:
          - incident
          - cpu
          - memory
          - heal
          - feed

permissions:
  contents: write

concurrency:
  group: tamagotchi-state
  cancel-in-progress: false

jobs:
  chaos:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📋 State before chaos
        run: cat state.json

      - name: 😈 Poke production
        run: python scripts/poke_prod.py "${{ inputs.action }}"

      - name: 🎨 Regenerate dashboard
        run: python scripts/tamagotchi.py --render-only

      - name: 🚨 Generate incident documentation
        run: python scripts/generate_incidents.py

      - name: 🔍 Show resulting state
        run: |
          echo "===== STATE ====="
          cat state.json

          echo ""
          echo "===== INCIDENTS ====="
          cat incidents.json

      - name: 🔍 Check generated files
        run: |
          echo "===== ASSETS ====="
          ls -la assets/

          echo ""
          echo "===== POSTMORTEMS ====="
          ls -la incidents/ || true

          echo ""
          echo "===== README DASHBOARD ====="
          grep "dashboard-" README.md || true

          echo ""
          echo "===== INCIDENT SUMMARY ====="
          head -40 INCIDENTS.md

      - name: 💾 Persist chaos
        run: |
          git config user.name "devops-tamagotchi[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            state.json \
            incidents.json \
            assets/ \
            incidents/ \
            INCIDENTS.md \
            README.md

          echo "===== CHANGES ====="
          git status --short

          git diff --cached --quiet && exit 0

          git commit -m "😈 poke prod: ${{ inputs.action }}"
          git push origin HEAD:main