name: 🐣 Keep Tamagotchi Alive

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: tamagotchi-state
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🩺 Check Tamagotchi
        run: python scripts/tamagotchi.py

      - name: 🔍 Show resulting state
        run: cat state.json

      - name: 🔍 Show generated dashboard
        run: |
          echo "===== GENERATED ASSETS ====="
          ls -la assets/

          echo ""
          echo "===== DASHBOARD STATUS ====="
          grep "STATUS" -A 2 assets/dashboard-*.svg || true

          echo ""
          echo "===== README IMAGE ====="
          grep "dashboard-" README.md || true

      - name: 💾 Save new state
        run: |
          git config user.name "devops-tamagotchi[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            state.json \
            assets/ \
            README.md

          git diff --cached --quiet && exit 0

          git commit -m "🐣 tamagotchi health check"
          git push origin HEAD:main
