name: 🐣 Keep Tamagotchi Alive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🩺 Check Tamagotchi
        run: python scripts/tamagotchi.py

      - name: 💾 Save new state
        run: |
          git config user.name "devops-tamagotchi[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json assets/dashboard.svg

          git diff --cached --quiet && exit 0

          git commit -m "🐣 tamagotchi health check"
          git push
